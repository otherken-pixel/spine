<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA meta -->
    <meta name="theme-color" content="#3d1f10" />
    <link rel="manifest" href="/spine/manifest.json" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spine" />
    <link rel="apple-touch-icon" href="/spine/apple-touch-icon.png" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Spine</title>
    <!-- Unregister any SW not scoped to /spine/ (clears stale registrations) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(r => {
            if (!r.scope.includes('/spine/')) r.unregister();
            else if (r.active && !r.active.scriptURL.includes('sw-v2')) r.unregister();
          });
        });
      }
    </script>
    <script type="module" crossorigin src="/spine/assets/index-7rDbbbkR.js"></script>
    <link rel="stylesheet" crossorigin href="/spine/assets/index-BXJgygym.css">
  </head>

    <div id="root"></div>
  </body>
</html>
